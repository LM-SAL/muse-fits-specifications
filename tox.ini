[tox]
envlist =
    py{312,313,314}-test
    build_docs
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = run tests
# Run from a temporary directory so the installed package is imported,
# never the source tree.
changedir = .tmp/{envname}
extras = test
commands =
    pytest --pyargs muse_fits_specifications {posargs}

[testenv:build_docs]
description = invoke sphinx-build to build the HTML docs
changedir = docs
extras = docs
commands =
    sphinx-build -W -b html . _build/html {posargs}
    python -c 'import pathlib; print("Documentation available under file://" + str(pathlib.Path(r"{toxinidir}") / "docs" / "_build" / "html" / "index.html"))'
