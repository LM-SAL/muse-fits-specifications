section: statistics
keywords:
  TOTVALS:
    required: true
    type: int
    example: '36100'
    comment: Expected number of data values (pixels)
  DATAVALS:
    required: true
    type: int
    example: '36100'
    comment: Actual number of data values in image
  MISSVALS:
    required: true
    type: int
    example: '0'
    comment: 'Missing values: TOTVALS'
  PERCENTD:
    required: true
    type: int
    example: '100'
    comment: Percent data; 100*DATAVALS
  DATAMIN:
    required: true
    type: int
    example: '101'
    comment: Minimum value of all pixels
  DATAMAX:
    required: true
    type: int
    example: '216'
    comment: Maximum value of all pixels
  DATAMEDN:
    required: true
    type: int
    example: '110'
    comment: Median value of all pixels
  DATAMEAN:
    required: true
    type: float
    example: '114.620529'
    comment: Mean value of all pixels
  DATARMS:
    required: true
    type: float
    example: '12.355817800000001'
    comment: Rms deviation from the mean value of all pixels
  DATASKEW:
    required: true
    type: float
    example: '3.4021735199999901'
    comment: Skewness from the mean value of all pixels
  DATAKURT:
    required: true
    type: float
    example: '14.218980800000001'
    comment: Kurtosis of all pixels
  DATAP01:
    required: true
    type: int
    example: '106'
    comment: 1% level for histogram of pixel values
  DATAP10:
    required: true
    type: int
    example: '108'
    comment: 10% level for histogram of pixel values
  DATAP25:
    required: true
    type: int
    example: '115'
    comment: 25% level for histogram of pixel values
  DATAP75:
    required: true
    type: int
    example: '162'
    comment: 75% level for histogram of pixel values
  DATAP90:
    required: true
    type: int
    example: '178'
    comment: 90% level for histogram of pixel values
  DATAP95:
    required: true
    type: int
    example: '187'
    comment: 95% level for histogram of pixel values
  DATAP98:
    required: true
    type: int
    example: '197'
    comment: 98% level for histogram of pixel values
  DATAP99:
    required: true
    type: int
    example: '207'
    comment: 99% level for histogram of pixel values
  NSATPIX:
    required: true
    type: int
    example: '0'
    comment: Number of saturated pixels
