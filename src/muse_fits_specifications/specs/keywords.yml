# Generated from keywords.csv by `python -m muse_fits_specifications.sheet`; edit the sheet, not this file.
- section: ''
  keywords:
  - name: XTENSION
    levels: {level0: all, level1: all, level2: all}
    type: str
    values: [BINTABLE]
    comment: binary table extension
    notes: Assuming L0 and L1 data is written as a compressed in the first extension like for IRIS
    library_owned: true
  - name: BITPIX
    levels: {level0: all, level1: all, level2: all}
    type: int
    values: [8, 16, 32, 64, -32, -64]
    comment: array data type
    notes: created by astropy fits
    library_owned: true
  - name: NAXIS
    levels: {level0: all, level1: all, level2: all}
    type: int
    minimum: 0
    maximum: 999
    comment: number of array dimensions
    notes: created by astropy fits
    library_owned: true
  - name: NAXIS1
    levels: {level0: all, level1: all, level2: all}
    type: int
    minimum: 1
    maximum: 4294967295
    comment: width of table in bytes
    notes: created by astropy fits
    library_owned: true
  - name: NAXIS2
    levels: {level0: all, level1: all, level2: all}
    type: int
    minimum: 1
    maximum: 4294967295
    comment: number of rows in table
    notes: created by astropy fits
    library_owned: true
  - name: PCOUNT
    levels: {level0: all, level1: all, level2: all}
    type: int
    minimum: 0
    maximum: 65535
    comment: number of group parameters
    notes: created by astropy fits
    library_owned: true
  - name: GCOUNT
