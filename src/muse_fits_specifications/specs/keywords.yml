    type: int
    minimum: 0
    maximum: 65535
    comment: number of groups
    notes: created by astropy fits
    library_owned: true
  - name: TFIELDS
    levels: {level0: all, level1: all, level2: all}
    type: int
    minimum: 0
    maximum: 999
    comment: number of fields in each row
    notes: created by astropy fits
    library_owned: true
  - name: TTYPE1
    levels: {level0: all, level1: all, level2: all}
