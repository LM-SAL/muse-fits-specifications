section: exposure
keywords:
  DATE-OBS:
    required: true
    type: str
    format: isot
    example: '''2024-11-08T00:59:04.234'''
    comment: '[ISO] Date when observation started; ISO 8; Perferred over DATE-OBS (thompson
      2015)'
  DATE-BEG:
    required: true
    type: str
    format: isot
    example: '''2024-11-08T00:59:04.234'''
    comment: Start time of data in ISO 8601
  T_OBS:
    required: true
    type: str
    format: isot
    example: '''2024-11-08T00:59:04.383'''
    comment: '[ISO] Observation time'
  IMGFPT:
    required: true
    type: str
    format: isot
    example: '''2024-11-08T00:59:04.793'''
    comment: '[ISO] Telemetry First Packet Time'
  ISYSN:
    required: true
    type: int
    example: '1'
    comment: 'Science packet SYStem Number: FUV'
  FSN:
    required: true
    type: int
    example: '136374300'
    comment: Filtergram Sequence Number
  FID:
    required: true
    type: int
    example: '65570'
    comment: Filtergram ID
  INSTRUME:
    required: true
    type: str
    example: '''SG'''
    comment: SG or CI; What MUSE components can be in the light path?
    values:
    - SG
    - CI
  IMG_PATH:
    required: false
    comment: listed without details in the source sheet
  IMG_TYPE:
    required: true
    type: str
    example: '''LIGHT   '''
    comment: 'Image type: LIGHT; DARK; LED; LTC; SPAT; VPAT'
    values:
    - LIGHT
    - DARK
    - LED
    - LTC
    - SPAT
    - VPAT
  CAMERA:
    required: true
    type: str
    example: '''SG108'''
    comment: CI, SG108, SG171, or SG 284
    values:
    - CI
    - SG108
    - SG171
    - SG284
  SUMSPTRL:
    required: true
    type: int
    example: '2'
    comment: CCD summing in spectral direction
  SUMSPAT:
    required: true
    type: int
    example: '2'
    comment: CCD summing in spatial direction
  EXPTIME:
    required: true
    type: float
    example: '0.298752815'
    comment: '[sec] Exposure duration: mean shutter open time'
  EXPSDEV:
    required: true
    type: float
    example: '1.02368744E-4'
    comment: '[sec] Exposure standard deviation'
  INT_TIME:
    required: true
    type: float
    example: '0.515625'
    comment: '[sec] CCD integration duration'
  QUALLEV0:
    required: true
    type: int
    example: '0'
    comment: Quality word
