[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-fits-specifications"
version = "0.1.0"
description = "Machine-readable MUSE FITS keyword specifications and header validation"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "astropy",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
]

# Keep isort's wrapping style identical to ruff-format's so the two
# pre-commit hooks converge instead of rewriting each other's output.
[tool.isort]
profile = "black"
line_length = 120

[tool.towncrier]
package = "muse_fits_specifications"
filename = "CHANGELOG.rst"
directory = "changelog/"
issue_format = "`#{issue} <https://github.com/LM-SAL/muse-fits-specifications/pull/{issue}>`__"
title_format = "{version} ({project_date})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "trivial"
name = "Internal Changes"
showcontent = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muse_fits_specifications = ["specs/*.csv", "specs/*/*.toml"]
